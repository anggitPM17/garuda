name: Garuda Compiler & GVM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGARUDA_STATIC_LINK=ON

      - name: Check Deterministic Build
        run: powershell -ExecutionPolicy Bypass -File scripts/check_deterministic.ps1

      - name: Build Test Executables
        run: |
          cmake --build build --target garuda_tco_tests garuda_control_flow_tests garuda_isolation_tests garuda_fault_tests garuda_runtime_stress_tests garuda_memory_tests garuda_error_reporting_tests garuda_fuzzing_tests garuda_grdmix_e2e_tests garuda_bytecode_io_tests garuda_compiler_api_tests garuda_formatter_linter_tests garuda_http_server_e2e_tests garuda_websocket_e2e_tests garuda_richat_backend_demo garuda_richat_backend_tests garuda_protobuf_minimal_tests garuda_tls_tests garuda_sqlite_tests garuda_query_builder_tests garuda_schema_migrator_tests garuda_health_check_tests garuda_logger_tests garuda_metrics_tests garuda_tracing_tests garuda_jwt_tests garuda_security_app_tests garuda_secret_manager_tests garuda_c_abi_tests garuda_fs_process_tests garuda_doc_generator_tests garuda_cli_example_tests garuda_embed_gvm_demo garuda_script_engine_tests garuda_actor_snapshot_tests garuda_nusantara_tests garuda_jalur_langit_tests garuda_connection_pool_tests garuda_query_cache_tests garuda_json_serializer_tests garuda_auth_manager_tests garuda_backup_manager_tests garuda_schema_migrator_jl_tests garuda_jalur_langit_bridge_tests garuda_autopilot_admin_gate_tests garuda_autopilot_health_monitor_tests garuda_autopilot_ai_code_fixer_tests garuda_autopilot_ai_tests garuda_richat_contract_tests garuda_richat_gateway_tests garuda_richat_room_tests garuda_richat_observability_tests garuda_richat_status_moment_tests garuda_richat_call_log_tests garuda_richat_server garuda_richat_server_smoke_tests garuda_gen_server_tests garuda_supervisor_tests garuda_application_tests garuda_pubsub_tests garuda_gen_statem_tests garuda_dist_node_tests garuda_global_registry_tests garuda_cluster_manager_tests garuda_pg_tests garuda_mnesia_tests garuda_mnesia_tier_tests garuda_mnesia_sweep_tests garuda_mnesia_cluster_tests garuda_crypto_tests garuda_key_transparency_tests garuda_sealed_sender_tests garuda_e2e_session_tests garuda_webrtc_signaling_tests garuda_presence_tests garuda_typing_indicator_tests garuda_read_receipt_tests garuda_reaction_tests garuda_shell_tests garuda_rpc_tests garuda_observer_tests garuda_telemetry_tests garuda_richat_app_tests garuda_richat_group_member_tests garuda_richat_group_fanout_tests garuda_richat_group_dist_tests garuda_richat_cold_db_tests garuda_anomaly_detector_tests garuda_rca_engine_tests garuda_action_engine_tests garuda_autopilot_runtime_tests garuda_bench_http_server garuda_bench_spawn

      - name: Verify Test Executables Exist
        shell: pwsh
        run: |
          $missing = @()
          foreach ($exe in @("garuda_tco_tests.exe", "garuda_control_flow_tests.exe", "garuda_isolation_tests.exe", "garuda_fault_tests.exe", "garuda_runtime_stress_tests.exe", "garuda_memory_tests.exe", "garuda_error_reporting_tests.exe", "garuda_fuzzing_tests.exe", "garuda_grdmix_e2e_tests.exe", "garuda_bytecode_io_tests.exe", "garuda_compiler_api_tests.exe", "garuda_formatter_linter_tests.exe", "garuda_http_server_e2e_tests.exe", "garuda_websocket_e2e_tests.exe", "garuda_richat_backend_demo.exe", "garuda_richat_backend_tests.exe", "garuda_protobuf_minimal_tests.exe", "garuda_tls_tests.exe", "garuda_sqlite_tests.exe", "garuda_query_builder_tests.exe", "garuda_schema_migrator_tests.exe", "garuda_health_check_tests.exe", "garuda_logger_tests.exe", "garuda_metrics_tests.exe", "garuda_tracing_tests.exe", "garuda_jwt_tests.exe", "garuda_security_app_tests.exe", "garuda_secret_manager_tests.exe", "garuda_c_abi_tests.exe", "garuda_fs_process_tests.exe", "garuda_doc_generator_tests.exe", "garuda_cli_example_tests.exe", "garuda_embed_gvm_demo.exe", "garuda_script_engine_tests.exe", "garuda_actor_snapshot_tests.exe", "garuda_nusantara_tests.exe", "garuda_jalur_langit_tests.exe", "garuda_connection_pool_tests.exe", "garuda_query_cache_tests.exe", "garuda_json_serializer_tests.exe", "garuda_auth_manager_tests.exe", "garuda_backup_manager_tests.exe", "garuda_schema_migrator_jl_tests.exe", "garuda_jalur_langit_bridge_tests.exe", "garuda_autopilot_admin_gate_tests.exe", "garuda_autopilot_health_monitor_tests.exe", "garuda_autopilot_ai_code_fixer_tests.exe", "garuda_autopilot_ai_tests.exe", "garuda_richat_contract_tests.exe", "garuda_richat_gateway_tests.exe", "garuda_richat_room_tests.exe", "garuda_richat_observability_tests.exe", "garuda_richat_status_moment_tests.exe", "garuda_richat_call_log_tests.exe", "garuda_richat_server.exe", "garuda_richat_server_smoke_tests.exe", "garuda_gen_server_tests.exe", "garuda_supervisor_tests.exe", "garuda_application_tests.exe", "garuda_pubsub_tests.exe", "garuda_gen_statem_tests.exe", "garuda_dist_node_tests.exe", "garuda_global_registry_tests.exe", "garuda_cluster_manager_tests.exe", "garuda_pg_tests.exe", "garuda_mnesia_tests.exe", "garuda_mnesia_tier_tests.exe", "garuda_mnesia_sweep_tests.exe", "garuda_mnesia_cluster_tests.exe", "garuda_crypto_tests.exe", "garuda_key_transparency_tests.exe", "garuda_sealed_sender_tests.exe", "garuda_e2e_session_tests.exe", "garuda_webrtc_signaling_tests.exe", "garuda_presence_tests.exe", "garuda_typing_indicator_tests.exe", "garuda_read_receipt_tests.exe", "garuda_reaction_tests.exe", "garuda_shell_tests.exe", "garuda_rpc_tests.exe", "garuda_observer_tests.exe", "garuda_telemetry_tests.exe", "garuda_richat_app_tests.exe", "garuda_richat_group_member_tests.exe", "garuda_richat_group_fanout_tests.exe", "garuda_richat_group_dist_tests.exe", "garuda_richat_cold_db_tests.exe", "garuda_anomaly_detector_tests.exe", "garuda_rca_engine_tests.exe", "garuda_action_engine_tests.exe", "garuda_autopilot_runtime_tests.exe", "garuda_bench_http_server.exe", "garuda_bench_spawn.exe")) {
              if (-not (Test-Path "build/$exe")) { $missing += $exe }
          }
          if ($missing.Count -gt 0) {
              Write-Host "Missing executables: $($missing -join ', ')"
              exit 1
          }

      - name: Verify Static Runtime (No C++ Runtime DLL)
        shell: pwsh
        run: |
          $deps = dumpbin /dependents build/garuda_tco_tests.exe
          if ($deps -match "VCRUNTIME" -or $deps -match "MSVCP") {
              Write-Host "DLL Dependents check failed! C++ Runtime DLL found in static binary."
              exit 1
          }
          Write-Host "Static Linking Verified: No C++ Runtime DLL dependents found."

      - name: Run Test - TCO Suite
        timeout-minutes: 5
        run: build/garuda_tco_tests.exe

      - name: Run Test - Control Flow Suite
        timeout-minutes: 5
        run: build/garuda_control_flow_tests.exe

      - name: Run Test - Process Isolation Suite
        timeout-minutes: 5
        run: build/garuda_isolation_tests.exe

      - name: Run Test - Fault Isolation Suite
        timeout-minutes: 10
        run: build/garuda_fault_tests.exe

      - name: Run Test - Runtime Stress & Preemption Suite
        timeout-minutes: 5
