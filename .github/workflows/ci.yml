name: Garuda Compiler & GVM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DGARUDA_STATIC_LINK=ON

      - name: Check Deterministic Build
        run: powershell -ExecutionPolicy Bypass -File scripts/check_deterministic.ps1

      - name: Build Test Executables
        run: |
          cmake --build build --target garuda_tco_tests garuda_control_flow_tests garuda_isolation_tests garuda_fault_tests garuda_runtime_stress_tests garuda_memory_tests garuda_error_reporting_tests garuda_fuzzing_tests garuda_grdmix_e2e_tests garuda_bytecode_io_tests garuda_compiler_api_tests garuda_formatter_linter_tests garuda_http_server_e2e_tests garuda_websocket_e2e_tests garuda_richat_backend_demo garuda_richat_backend_tests garuda_protobuf_minimal_tests garuda_tls_tests garuda_sqlite_tests garuda_query_builder_tests garuda_schema_migrator_tests garuda_health_check_tests garuda_logger_tests garuda_metrics_tests garuda_tracing_tests garuda_jwt_tests garuda_security_app_tests garuda_secret_manager_tests garuda_c_abi_tests garuda_fs_process_tests garuda_doc_generator_tests garuda_cli_example_tests garuda_embed_gvm_demo garuda_script_engine_tests garuda_actor_snapshot_tests garuda_nusantara_tests garuda_jalur_langit_tests garuda_connection_pool_tests garuda_query_cache_tests garuda_json_serializer_tests garuda_auth_manager_tests garuda_backup_manager_tests garuda_schema_migrator_jl_tests garuda_bench_http_server garuda_bench_spawn

      - name: Verify Test Executables Exist
        shell: pwsh
        run: |
          $missing = @()
          foreach ($exe in @("garuda_tco_tests.exe", "garuda_control_flow_tests.exe", "garuda_isolation_tests.exe", "garuda_fault_tests.exe", "garuda_runtime_stress_tests.exe", "garuda_memory_tests.exe", "garuda_error_reporting_tests.exe", "garuda_fuzzing_tests.exe", "garuda_grdmix_e2e_tests.exe", "garuda_bytecode_io_tests.exe", "garuda_compiler_api_tests.exe", "garuda_formatter_linter_tests.exe", "garuda_http_server_e2e_tests.exe", "garuda_websocket_e2e_tests.exe", "garuda_richat_backend_demo.exe", "garuda_richat_backend_tests.exe", "garuda_protobuf_minimal_tests.exe", "garuda_tls_tests.exe", "garuda_sqlite_tests.exe", "garuda_query_builder_tests.exe", "garuda_schema_migrator_tests.exe", "garuda_health_check_tests.exe", "garuda_logger_tests.exe", "garuda_metrics_tests.exe", "garuda_tracing_tests.exe", "garuda_jwt_tests.exe", "garuda_security_app_tests.exe", "garuda_secret_manager_tests.exe", "garuda_c_abi_tests.exe", "garuda_fs_process_tests.exe", "garuda_doc_generator_tests.exe", "garuda_cli_example_tests.exe", "garuda_embed_gvm_demo.exe", "garuda_script_engine_tests.exe", "garuda_actor_snapshot_tests.exe", "garuda_nusantara_tests.exe", "garuda_jalur_langit_tests.exe", "garuda_connection_pool_tests.exe", "garuda_query_cache_tests.exe", "garuda_json_serializer_tests.exe", "garuda_auth_manager_tests.exe", "garuda_backup_manager_tests.exe", "garuda_schema_migrator_jl_tests.exe", "garuda_bench_http_server.exe", "garuda_bench_spawn.exe")) {
              if (-not (Test-Path "build/$exe")) { $missing += $exe }
          }
          if ($missing.Count -gt 0) {
              Write-Host "Missing executables: $($missing -join ', ')"
              exit 1
          }

      - name: Verify Static Runtime (No C++ Runtime DLL)
        shell: pwsh
        run: |
          $deps = dumpbin /dependents build/garuda_tco_tests.exe
          if ($deps -match "VCRUNTIME" -or $deps -match "MSVCP") {
              Write-Host "DLL Dependents check failed! C++ Runtime DLL found in static binary."
              exit 1
          }
          Write-Host "Static Linking Verified: No C++ Runtime DLL dependents found."

      - name: Run Test - TCO Suite
        timeout-minutes: 5
        run: build/garuda_tco_tests.exe

      - name: Run Test - Control Flow Suite
        timeout-minutes: 5
        run: build/garuda_control_flow_tests.exe

      - name: Run Test - Process Isolation Suite
        timeout-minutes: 5
        run: build/garuda_isolation_tests.exe

      - name: Run Test - Fault Isolation Suite
        timeout-minutes: 10
        run: build/garuda_fault_tests.exe

      - name: Run Test - Runtime Stress & Preemption Suite
        timeout-minutes: 5
        run: build/garuda_runtime_stress_tests.exe

      - name: Run Test - Memory Allocator Suite
        timeout-minutes: 5
        run: build/garuda_memory_tests.exe

      - name: Run Test - Error Reporting & Diagnostics Suite
        timeout-minutes: 5
        run: build/garuda_error_reporting_tests.exe

      - name: Run Test - Fuzzing Suite
        timeout-minutes: 5
        run: build/garuda_fuzzing_tests.exe

      - name: Run Test - Package Manager grdmix E2E Suite
        timeout-minutes: 5
        run: build/garuda_grdmix_e2e_tests.exe

      - name: Run Test - Bytecode I/O & Checksum Suite
        timeout-minutes: 5
        run: build/garuda_bytecode_io_tests.exe

      - name: Run Test - In-Process Compiler API Suite
        timeout-minutes: 5
        run: build/garuda_compiler_api_tests.exe

      - name: Run Test - Formatter & Linter Suite
        timeout-minutes: 5
        run: build/garuda_formatter_linter_tests.exe

      - name: Run Test - HTTP Server E2E Suite
        timeout-minutes: 5
        run: build/garuda_http_server_e2e_tests.exe

      - name: Run Test - WebSocket E2E Suite
        timeout-minutes: 5
        run: build/garuda_websocket_e2e_tests.exe

      - name: Run Test - RICHAT Backend Demo E2E Suite
        timeout-minutes: 5
        run: build/garuda_richat_backend_tests.exe

      - name: Run Test - Minimal Native Protobuf Suite
        timeout-minutes: 5
        run: build/garuda_protobuf_minimal_tests.exe

      - name: Run Test - Native mbedTLS TLS/SSL Suite
        timeout-minutes: 5
        run: build/garuda_tls_tests.exe

      - name: Run Test - SQLite3 Amalgamation Driver Suite
        timeout-minutes: 5
        run: build/garuda_sqlite_tests.exe

      - name: Run Test - Query Builder & Parameter Binding Suite
        timeout-minutes: 5
        run: build/garuda_query_builder_tests.exe

      - name: Run Test - Schema Migrator Engine Suite
        timeout-minutes: 5
        run: build/garuda_schema_migrator_tests.exe

      - name: Run Test - Health Check & Readiness Probe Suite
        timeout-minutes: 5
        run: build/garuda_health_check_tests.exe

      - name: Run Test - Structured JSON Logger Suite
        timeout-minutes: 5
        run: build/garuda_logger_tests.exe

      - name: Run Test - Prometheus Metrics Registry Suite
        timeout-minutes: 5
        run: build/garuda_metrics_tests.exe

      - name: Run Test - OpenTelemetry Distributed Tracing Suite
        timeout-minutes: 5
        run: build/garuda_tracing_tests.exe

      - name: Run Test - JWT HS256 Authentication Suite
        timeout-minutes: 5
        run: build/garuda_jwt_tests.exe

      - name: Run Test - Rate Limiter & Input Validation Security Suite
        timeout-minutes: 5
        run: build/garuda_security_app_tests.exe

      - name: Run Test - Secret Manager Environment Loader Suite
        timeout-minutes: 5
        run: build/garuda_secret_manager_tests.exe

      - name: Run Test - FFI C ABI & Function Registry Suite
        timeout-minutes: 5
        run: build/garuda_c_abi_tests.exe

      - name: Run Test - Filesystem & Process Execution Suite
        timeout-minutes: 5
        run: build/garuda_fs_process_tests.exe

      - name: Run Test - Automated Doc Generator Suite
        timeout-minutes: 5
        run: build/garuda_doc_generator_tests.exe

      - name: Run Test - CLI Tool Example Project Suite
        timeout-minutes: 5
        run: build/garuda_cli_example_tests.exe

      - name: Run Test - Script Engine & Embedding Suite
        timeout-minutes: 5
        run: build/garuda_script_engine_tests.exe

      - name: Run Test - Actor Persistence & Event Sourcing Suite
        timeout-minutes: 5
        run: build/garuda_actor_snapshot_tests.exe

      - name: Run Test - Garuda Nusantara Ecosystem Suite
        timeout-minutes: 5
        run: build/garuda_nusantara_tests.exe

      - name: Run Test - Jalur Langit Database Engine Suite
        timeout-minutes: 5
        run: build/garuda_jalur_langit_tests.exe

      - name: Run Test - Jalur Langit Connection Pool Suite
        timeout-minutes: 5
        run: build/garuda_connection_pool_tests.exe

      - name: Run Test - Jalur Langit Query Cache Suite
        timeout-minutes: 5
        run: build/garuda_query_cache_tests.exe

      - name: Run Test - Jalur Langit JSON Serializer Suite
        timeout-minutes: 5
        run: build/garuda_json_serializer_tests.exe

      - name: Run Test - Jalur Langit Auth Manager Suite
        timeout-minutes: 5
        run: build/garuda_auth_manager_tests.exe

      - name: Run Test - Jalur Langit Backup Manager Suite
        timeout-minutes: 5
        run: build/garuda_backup_manager_tests.exe

      - name: Run Test - Jalur Langit Schema Migrator Suite
        timeout-minutes: 5
        run: build/garuda_schema_migrator_jl_tests.exe

      - name: Run Performance Benchmarks
        timeout-minutes: 5
        run: powershell -ExecutionPolicy Bypass -File scripts/run_tests.ps1