name: Garuda Compiler & GVM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Check Deterministic Build
        run: powershell -ExecutionPolicy Bypass -File scripts/check_deterministic.ps1

      - name: Build Test Executables
        run: |
          cmake --build build --target garuda_tco_tests garuda_control_flow_tests garuda_isolation_tests garuda_fault_tests garuda_runtime_stress_tests garuda_memory_tests garuda_error_reporting_tests garuda_fuzzing_tests garuda_grdmix_e2e_tests garuda_bytecode_io_tests garuda_compiler_api_tests garuda_formatter_linter_tests garuda_http_server_e2e_tests garuda_sqlite_tests garuda_query_builder_tests garuda_bench_http_server garuda_bench_spawn

      - name: Verify Test Executables Exist
        shell: pwsh
        run: |
          $missing = @()
          foreach ($exe in @("garuda_tco_tests.exe", "garuda_control_flow_tests.exe", "garuda_isolation_tests.exe", "garuda_fault_tests.exe", "garuda_runtime_stress_tests.exe", "garuda_memory_tests.exe", "garuda_error_reporting_tests.exe", "garuda_fuzzing_tests.exe", "garuda_grdmix_e2e_tests.exe", "garuda_bytecode_io_tests.exe", "garuda_compiler_api_tests.exe", "garuda_formatter_linter_tests.exe", "garuda_http_server_e2e_tests.exe", "garuda_sqlite_tests.exe", "garuda_query_builder_tests.exe", "garuda_bench_http_server.exe", "garuda_bench_spawn.exe")) {
              if (-not (Test-Path "build/$exe")) { $missing += $exe }
          }
          if ($missing.Count -gt 0) {
              Write-Host "Missing executables: $($missing -join ', ')"
              exit 1
          }

      - name: Run Test - TCO Suite
        timeout-minutes: 5
        run: build/garuda_tco_tests.exe

      - name: Run Test - Control Flow Suite
        timeout-minutes: 5
        run: build/garuda_control_flow_tests.exe

      - name: Run Test - Process Isolation Suite
        timeout-minutes: 5
        run: build/garuda_isolation_tests.exe

      - name: Run Test - Fault Isolation Suite
        timeout-minutes: 10
        run: build/garuda_fault_tests.exe

      - name: Run Test - Runtime Stress & Preemption Suite
        timeout-minutes: 5
        run: build/garuda_runtime_stress_tests.exe

      - name: Run Test - Memory Allocator Suite
        timeout-minutes: 5
        run: build/garuda_memory_tests.exe

      - name: Run Test - Error Reporting & Diagnostics Suite
        timeout-minutes: 5
        run: build/garuda_error_reporting_tests.exe

      - name: Run Test - Fuzzing Suite
        timeout-minutes: 5
        run: build/garuda_fuzzing_tests.exe

      - name: Run Test - Package Manager grdmix E2E Suite
        timeout-minutes: 5
        run: build/garuda_grdmix_e2e_tests.exe

      - name: Run Test - Bytecode I/O & Checksum Suite
        timeout-minutes: 5
        run: build/garuda_bytecode_io_tests.exe

      - name: Run Test - In-Process Compiler API Suite
        timeout-minutes: 5
        run: build/garuda_compiler_api_tests.exe

      - name: Run Test - Formatter & Linter Suite
        timeout-minutes: 5
        run: build/garuda_formatter_linter_tests.exe

      - name: Run Test - HTTP Server E2E Suite
        timeout-minutes: 5
        run: build/garuda_http_server_e2e_tests.exe

      - name: Run Test - SQLite3 Amalgamation Driver Suite
        timeout-minutes: 5
        run: build/garuda_sqlite_tests.exe

      - name: Run Test - Query Builder & Parameter Binding Suite
        timeout-minutes: 5
        run: build/garuda_query_builder_tests.exe

      - name: Run Performance Benchmarks
        timeout-minutes: 5
        run: powershell -ExecutionPolicy Bypass -File scripts/run_benchmarks.ps1
