name: Garuda Compiler & GVM CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Test Executables
        run: |
          cmake --build build --config Release --target garuda_tco_tests garuda_control_flow_tests garuda_isolation_tests garuda_fault_tests

      - name: Verify Test Executables Exist
        shell: pwsh
        run: |
          $missing = @()
          foreach ($exe in @("garuda_tco_tests.exe", "garuda_control_flow_tests.exe", "garuda_isolation_tests.exe", "garuda_fault_tests.exe")) {
              if (-not (Test-Path "build/Release/$exe")) { $missing += $exe }
          }
          if ($missing.Count -gt 0) {
              Write-Host "Missing executables: $($missing -join ', ')"
              exit 1
          }

      - name: Run Test - TCO Suite
        timeout-minutes: 5
        run: build/Release/garuda_tco_tests.exe

      - name: Run Test - Control Flow Suite
        timeout-minutes: 5
        run: build/Release/garuda_control_flow_tests.exe

      - name: Run Test - Process Isolation Suite
        timeout-minutes: 5
        run: build/Release/garuda_isolation_tests.exe

      - name: Run Test - Fault Isolation Suite
        timeout-minutes: 10
        run: build/Release/garuda_fault_tests.exe
