name: Garuda Compiler CI & Cross-Platform Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets
      run: cmake --build build --config Release

    - name: Run EventLoop Backend Tests
      run: |
        ${{ matrix.os == 'windows-latest' && '.\build\Release\garuda_event_loop_backend_tests.exe' || './build/garuda_event_loop_backend_tests' }}

    - name: Run EventLoop Benchmark
      run: |
        ${{ matrix.os == 'windows-latest' && '.\build\Release\bench_event_loop_backend.exe 1000 3' || './build/bench_event_loop_backend 10000 3' }}
