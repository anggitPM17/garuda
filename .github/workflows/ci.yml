name: GVM CI/CD Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build C++ & Verify Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libsqlite3-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGARUDA_BUILD_TESTS=OFF

      - name: Build garuda_richat_server & gvm-admin
        run: cmake --build build --target garuda_richat_server gvm-admin -j$(nproc)

      - name: Verify Executables
        run: |
          ls -la build/garuda_richat_server
          ls -la build/gvm-admin
          ./build/gvm-admin help

  deploy:
    name: Auto Deploy to VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/garuda/garuda_v67_0_production/garuda_v67.0.0
            git pull origin main
            cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DGARUDA_BUILD_TESTS=OFF
            make garuda_richat_server gvm-admin -j2
            cp gvm-admin /usr/local/bin/gvm-admin
            chmod +x /usr/local/bin/gvm-admin
            systemctl restart richat-garuda
            echo "✅ Auto-Deploy GVM Selesai: $(date)"
